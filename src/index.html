<!DOCTYPE html>
<html lang="ru">
<head>
<!--	-->
<!--	Сделайте  HTML файл с формой, в которой нужно ввести-->
<!--	в текстовом поле текст вашего запроса, который при нажатии-->
<!--	на кнопку Submit/Запросить будет передаваться гуглу-->
<!--	и там обрабатываться-запрашиваться-->
<!--	Хинт- поменяйте action и вместо заглушки поставьте актуальный адрес-->
<!--	поисковика и посмотрите как правильно передать в него параметр-->
<!--	запроса-->
<!--	-->
	
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Поисковая форма Google</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f8f9fa;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}
		.search-box {
			background-color: #ffffff;
			padding: 30px;
			border-radius: 8px;
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
			text-align: center;
			max-width: 450px;
			width: 100%;
		}
		h2 {
			color: #202124;
			margin-bottom: 20px;
			font-size: 24px;
		}
		.form-group {
			display: flex;
			gap: 10px;
		}
		input[type="text"] {
			flex-grow: 1;
			padding: 12px 15px;
			border: 1px solid #dadce0;
			border-radius: 4px;
			font-size: 16px;
			outline: none;
			transition: border-color 0.2s;
		}
		input[type="text"]:focus {
			border-color: #1a73e8;
		}
		button {
			background-color: #1a73e8;
			color: white;
			border: none;
			padding: 12px 20px;
			font-size: 16px;
			font-weight: bold;
			border-radius: 4px;
			cursor: pointer;
			transition: background-color 0.2s;
		}
		button:hover {
			background-color: #1557b0;
		}
	</style>
</head>
<body>

<div class="search-box">
	<h2>Поиск в Google</h2>
	
	<form action="https://www.google.com/search" method="GET" target="_blank">
		<div class="form-group">
			<input type="text" name="q" placeholder="Что хотите найти?" required autocomplete="off">
			<button type="submit">Запросить</button>
		</div>
	</form>
</div>

</body>
</html>
