<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bootstrap 5</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-0">

<div class="container-fluid px-0 text-center">
	
	<h2 class="text-dark my-0">
    <span class="d-block d-sm-none bg-dark text-white py-3 w-100">
        XS
    </span>
		
		<span class="d-none d-sm-block d-md-none bg-dark text-white py-3 w-100">
        SM
    </span>
		
		<span class="d-none d-md-block d-xl-none bg-dark text-white py-3 w-100">
        MD / LG
    </span>
		
		<span class="d-none d-xl-block bg-dark text-white py-3 w-100">
        XL
    </span>
	</h2>
	
	<div class="row g-0">
		<div class="col-12 col-sm-6 col-md-4 col-xl">
			<div class="bg-danger py-5 fs-4 text-white fw-bold">1.</div>
		</div>
		
		<div class="col-12 col-sm-6 col-md-4 col-xl">
			<div class="py-5 fs-4 text-white fw-bold" style="background-color: #fd7e14;">2.</div>
		</div>
		
		<div class="col-12 col-sm-6 col-md-4 col-xl">
			<div class="bg-warning py-5 fs-4 text-white fw-bold">3.</div>
		</div>
		
		<div class="col-12 col-sm-6 col-md-6 col-xl">
			<div class="bg-success py-5 fs-4 text-white fw-bold">4.</div>
		</div>
		
		<div class="col-12 col-sm-12 col-md-6 col-xl">
			<div class="bg-info py-5 fs-4 text-white fw-bold">5.</div>
		</div>
	</div>
</div>

</body>
</html>
